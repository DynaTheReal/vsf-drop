<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSF Drop - Brawl Stars Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lilita+One&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Lilita One', cursive, sans-serif;
            overflow: hidden;
            background: radial-gradient(circle, #5bb32a 0%, #2e6912 100%);
            transition: background 0.5s ease;
        }

        /* Rarity Title */
        #rarity-text {
            font-size: 3.2rem;
            color: #ffffff;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 5px 15px rgba(0,0,0,0.6);
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        /* Drop Container with 3D Perspective */
        .drop-container {
            position: relative;
            width: 320px;
            height: 320px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Clean Radial Light Glow behind Logo */
        .clean-glow {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 1;
            opacity: 0.6;
            transition: transform 0.2s, opacity 0.2s, background 0.4s;
            pointer-events: none;
        }

        /* HD VSF Drop Image */
        .drop-img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: screen; /* Entfernt den schwarzen Hintergrund absolut sauber */
            filter: drop-shadow(0px 12px 15px rgba(0,0,0,0.5));
            transform-style: preserve-3d;
            transition: filter 0.3s ease;
        }

        /* Upgrade Chances Bar */
        .upgrade-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .upgrade-title {
            color: #ffffff;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 12px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .upgrade-title.tap-ready {
            font-size: 1.6rem;
            color: #ffe600;
            animation: titlePulse 0.8s infinite alternate;
        }

        .dots-wrapper {
            display: flex;
            gap: 14px;
        }

        .dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid #000;
            background: #444;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
        }

        .dot.active {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.9);
            transform: scale(1.15);
        }

        /* Reward Modal */
        .reward-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .reward-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .reward-card {
            background: #222;
            border: 4px solid #fff;
            border-radius: 20px;
            padding: 30px 50px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reward-overlay.show .reward-card {
            transform: scale(1);
        }

        .reward-icon-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px;
        }

        .reward-icon {
            font-size: 5rem;
        }

        .reward-title {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        .reward-value {
            font-size: 2.8rem;
            margin: 10px 0;
            text-shadow: 2px 2px 0 #000;
        }

        .golden-heart {
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700, 2px 2px 0 #000;
        }

        .totem-svg {
            width: 110px;
            height: 110px;
            filter: drop-shadow(0 0 15px #ffd700);
            animation: totemGlow 1.5s infinite alternate ease-in-out;
        }

        @keyframes totemGlow {
            0% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 12px #ffd700); }
            100% { transform: scale(1.1) rotate(3deg); filter: drop-shadow(0 0 25px #ffae00); }
        }

        .btn-reset {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-family: inherit;
            background: #2ecc71;
            color: white;
            border: 3px solid #000;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b8a47;
            transition: transform 0.1s, background 0.2s;
        }

        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1b8a47;
        }

        /* Cleane Klick-Animation (Sanfter Druck nach unten) */
        .clean-tap {
            animation: cleanTapAnim 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cleanTapAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* 3D Flip Upgrade Animation (Drehung über die Rückseite) */
        .upgrade-3d-flip {
            animation: flip3D 0.75s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes flip3D {
            0% { transform: translateY(0) rotateY(0deg) scale(1); filter: brightness(1); }
            50% { transform: translateY(-90px) rotateY(180deg) scale(1.3); filter: brightness(1.7) drop-shadow(0 0 25px rgba(255,255,255,0.8)); }
            100% { transform: translateY(0) rotateY(360deg) scale(1); filter: brightness(1); }
        }

        /* finale Öffnungs-Animation */
        .open-anim {
            animation: dropOpenBurst 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes dropOpenBurst {
            0% { transform: scale(1) rotateY(0deg); }
            30% { transform: scale(0.85) rotateY(-20deg); }
            60% { transform: scale(1.4) rotateY(180deg); filter: brightness(2.5); }
            100% { transform: scale(3) rotateY(360deg); opacity: 0; filter: brightness(4); }
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div id="rarity-text">RARE</div>

    <div class="drop-container" id="drop">
        <div class="clean-glow" id="clean-glow"></div>
        <!-- Exaktes HD VSF Bild -->
        <img src="vsf.png" alt="VSF Drop" class="drop-img" id="drop-img">
    </div>

    <div class="upgrade-container">
        <div class="upgrade-title" id="upgrade-title">UPGRADE CHANCES</div>
        <div class="dots-wrapper">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="reward-overlay" id="reward-overlay">
        <div class="reward-card">
            <div class="reward-title" id="reward-rarity">RARE</div>
            <div class="reward-icon-container" id="reward-icon-container">
                <span class="reward-icon" id="reward-icon">🪙</span>
            </div>
            <div class="reward-value" id="reward-value">50 Coins</div>
            <button class="btn-reset" id="btn-reset">Nochmal versuchen</button>
        </div>
    </div>

    <script>
        const GOLDEN_TOTEM_SVG = `
            <svg class="totem-svg" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFF59D" />
                        <stop offset="40%" stop-color="#FFD700" />
                        <stop offset="100%" stop-color="#B8860B" />
                    </linearGradient>
                </defs>
                <path d="M 5,35 Q 25,15 50,35 Q 75,15 95,35 Q 75,55 50,40 Q 25,55 5,35 Z" fill="url(#goldGrad)" stroke="#000" stroke-width="3"/>
                <rect x="33" y="20" width="34" height="60" rx="8" fill="url(#goldGrad)" stroke="#000" stroke-width="3.5"/>
                <circle cx="42" cy="38" r="4.5" fill="#00ff66" stroke="#000" stroke-width="1.5"/>
                <circle cx="58" cy="38" r="4.5" fill="#00ff66" stroke="#000" stroke-width="1.5"/>
                <path d="M 40,54 L 60,54" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
                <text x="50" y="70" font-family="'Lilita One', cursive" font-size="11" fill="#000" text-anchor="middle">VSF</text>
            </svg>
        `;

        const STAGES = [
            { name: 'RARE', color: '#2ecc71', bg: 'radial-gradient(circle, #5bb32a 0%, #2e6912 100%)', reward: '50 Coins', icon: '🪙', type: 'emoji' },
            { name: 'SUPER RARE', color: '#3498db', bg: 'radial-gradient(circle, #2980b9 0%, #1a365d 100%)', reward: '100 Coins', icon: '🪙', type: 'emoji' },
            { name: 'EPIC', color: '#9b59b6', bg: 'radial-gradient(circle, #8e44ad 0%, #4a154b 100%)', reward: '1/2 Herz', icon: '💔', type: 'emoji' },
            { name: 'MYTHIC', color: '#e74c3c', bg: 'radial-gradient(circle, #c0392b 0%, #5c0606 100%)', reward: '1 Herz', icon: '❤️', type: 'emoji', class: 'golden-heart' },
            { name: 'LEGENDARY', color: '#f1c40f', bg: 'radial-gradient(circle, #f39c12 0%, #7e5109 100%)', reward: 'VSF Totem', icon: GOLDEN_TOTEM_SVG, type: 'svg' }
        ];

        let currentStage = 0;
        let currentTap = 0;
        let isOpening = false;

        const dropEl = document.getElementById('drop');
        const dropImg = document.getElementById('drop-img');
        const cleanGlow = document.getElementById('clean-glow');
        const rarityText = document.getElementById('rarity-text');
        const upgradeTitle = document.getElementById('upgrade-title');
        const dots = document.querySelectorAll('.dot');
        const rewardOverlay = document.getElementById('reward-overlay');
        const rewardRarity = document.getElementById('reward-rarity');
        const rewardIconContainer = document.getElementById('reward-icon-container');
        const rewardValue = document.getElementById('reward-value');
        const btnReset = document.getElementById('btn-reset');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type = 'sine', duration = 0.15) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playUpgradeSound() {
            playSound(300, 'triangle', 0.1);
            setTimeout(() => playSound(480, 'triangle', 0.12), 100);
            setTimeout(() => playSound(700, 'triangle', 0.25), 200);
        }

        function playPopSound() {
            playSound(240, 'sine', 0.08);
        }

        function playExplodeSound() {
            playSound(150, 'sawtooth', 0.3);
            setTimeout(() => playSound(350, 'square', 0.3), 100);
            setTimeout(() => playSound(650, 'square', 0.4), 220);
        }

        function playWinSound() {
            [400, 550, 700, 900].forEach((freq, idx) => {
                setTimeout(() => playSound(freq, 'square', 0.25), idx * 100);
            });
        }

        function triggerCleanLight() {
            cleanGlow.style.transform = 'scale(1.25)';
            cleanGlow.style.opacity = '0.9';
            setTimeout(() => {
                cleanGlow.style.transform = 'scale(1)';
                cleanGlow.style.opacity = '0.6';
            }, 200);
        }

        // Tap Mechanics
        dropEl.addEventListener('click', () => {
            if (isOpening) return;

            triggerCleanLight();

            // Open on final tap
            if (currentTap === 4) {
                isOpening = true;
                dropImg.classList.remove('clean-tap', 'upgrade-3d-flip');
                void dropImg.offsetWidth;
                dropImg.classList.add('open-anim');
                
                playExplodeSound();

                setTimeout(() => {
                    revealReward();
                }, 750);
                return;
            }

            // Fill dot
            dots[currentTap].classList.add('active');
            currentTap++;

            const upgrades = Math.random() < 0.5 && currentStage < STAGES.length - 1;

            if (upgrades) {
                currentStage++;
                dropImg.classList.remove('clean-tap', 'upgrade-3d-flip');
                void dropImg.offsetWidth;
                dropImg.classList.add('upgrade-3d-flip');
                updateStageUI();
                playUpgradeSound();
            } else {
                dropImg.classList.remove('clean-tap', 'upgrade-3d-flip');
                void dropImg.offsetWidth;
                dropImg.classList.add('clean-tap');
                playPopSound();
            }

            if (currentTap === 4) {
                upgradeTitle.innerText = "TIPPE ZUM ÖFFNEN!";
                upgradeTitle.classList.add('tap-ready');
            }
        });

        function updateStageUI() {
            const stage = STAGES[currentStage];
            rarityText.innerText = stage.name;
            rarityText.style.color = stage.color;
            document.body.style.background = stage.bg;
        }

        function revealReward() {
            const stage = STAGES[currentStage];
            
            rewardRarity.innerText = stage.name;
            rewardRarity.style.color = stage.color;
            rewardValue.innerText = stage.reward;

            if (stage.type === 'svg') {
                rewardIconContainer.innerHTML = stage.icon;
            } else {
                rewardIconContainer.innerHTML = `<span class="reward-icon ${stage.class || ''}">${stage.icon}</span>`;
            }

            if (stage.class === 'golden-heart') {
                rewardValue.className = 'reward-value golden-heart';
            } else {
                rewardValue.className = 'reward-value';
            }

            rewardOverlay.classList.add('show');
            playWinSound();
        }

        // Reset
        btnReset.addEventListener('click', () => {
            currentStage = 0;
            currentTap = 0;
            isOpening = false;
            
            dropImg.classList.remove('open-anim', 'clean-tap', 'upgrade-3d-flip');
            dropImg.style.opacity = '1';

            dots.forEach(dot => dot.classList.remove('active'));
            upgradeTitle.innerText = "UPGRADE CHANCES";
            upgradeTitle.classList.remove('tap-ready');
            
            rewardOverlay.classList.remove('show');
            updateStageUI();
        });

        // Initialize First State
        updateStageUI();
    </script>
</body>
</html>
